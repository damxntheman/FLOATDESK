name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check public/client.js && node --check src/server.js
      - run: npm test

  native-files-broker-macos:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile production native Mac Files broker
        run: |
          xcrun swiftc native/macos/FloatdeskNativeFilesBroker.swift -o "$RUNNER_TEMP/floatdesk-files-broker"
      - name: Compile isolated fixture-test variant
        run: |
          xcrun swiftc -D FLOATDESK_TESTING native/macos/FloatdeskNativeFilesBroker.swift -o "$RUNNER_TEMP/floatdesk-files-test"
      - name: Exercise directory FD traversal and metadata boundaries
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/floatdesk-test-root"
          OUTSIDE="$RUNNER_TEMP/floatdesk-test-private"
          mkdir -p "$ROOT/Folder" "$OUTSIDE"
          printf 'secret contents' > "$ROOT/Folder/recording.flp"
          printf 'hidden' > "$ROOT/.secret"
          printf 'private' > "$OUTSIDE/token.txt"
          ln -s "$OUTSIDE" "$ROOT/Escape"
          "$RUNNER_TEMP/floatdesk-files-test" --self-test "$ROOT" > "$RUNNER_TEMP/files-result.json"
          python3 - <<'PY'
          import json,os
          result=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'files-result.json')))
          assert result['traversalDenied'] and result['symlinkDenied']
          assert result['repeatStable']
          assert result['root'] == result['repeatedRoot']
          assert result['nested'] == result['repeatedNested']
          assert result['root']['entries'] == [{'kind':'folder','name':'Folder'}]
          assert result['nested']['entries'] == [{'kind':'file','name':'recording.flp'}]
          assert 'secret contents' not in str(result) and 'token.txt' not in str(result)
          print('Native file broker FD containment smoke test passed')
          PY


  native-consent-research-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and execute detached native consent authority fixture
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library \
            native/macos/FloatdeskNativeConsentResearch.swift \
            native/macos/FloatdeskNativeConsentSmoke.swift \
            -o "$RUNNER_TEMP/floatdesk-native-consent-smoke"
          "$RUNNER_TEMP/floatdesk-native-consent-smoke"
      - name: Assert native research authority is not connected to privileged paths
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          forbidden = [
              pathlib.Path('native/macos/FloatdeskMacHost.swift'),
              pathlib.Path('src/server.js'),
              pathlib.Path('src/native-files-broker.js'),
              pathlib.Path('src/control.js'),
              pathlib.Path('public/client.js'),
              pathlib.Path('native/macos/FloatdeskNativeFilesBroker.swift'),
              pathlib.Path('native/macos/FloatdeskAgent.swift'),
          ]
          for path in forbidden:
              source = path.read_text()
              assert 'FloatdeskNativeConsentResearch' not in source, str(path)
          core = pathlib.Path('native/macos/FloatdeskNativeConsentResearch.swift').read_text()
          for forbidden_symbol in ('NSWorkspace', 'NSOpenPanel', 'CGEvent', 'ScreenCaptureKit', 'NWListener', 'Process()'):
              assert forbidden_symbol not in core, forbidden_symbol
          print('M15 native research authority remains disconnected from live permission paths')
          PY

  mac-menu-shell-bundle:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile and ad-hoc sign the research-only menu bar app
        env:
          FLOATDESK_ADHOC_SIGN: '1'
        run: |
          bash scripts/build-mac-host.sh "$RUNNER_TEMP"
      - name: Ensure ad-hoc research Mac build is REFUSED by release gate
        run: |
          set -euo pipefail
          if FLOATDESK_EXPECTED_TEAM_ID=AAAAAAAAAA bash scripts/verify-mac-release.sh "$RUNNER_TEMP/FLOATDESK Mac Host.app"; then
            echo "FAIL: development build incorrectly passed the production gate" >&2
            exit 1
          fi
          echo "M12 production release gate correctly blocks ad-hoc Mac bundle"
      - name: Install Node dependencies for local service smoke test
        run: npm install --no-audit --no-fund
      - name: Compile and exercise explicit Mac-owned local lifecycle
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library native/macos/FloatdeskInstanceLock.swift native/macos/FloatdeskSourceSeal.swift native/macos/FloatdeskLocalService.swift native/macos/FloatdeskLocalServiceSmoke.swift -o "$RUNNER_TEMP/floatdesk-local-service-smoke"
          FLOATDESK_REPO_ROOT="$GITHUB_WORKSPACE" FLOATDESK_NODE_BIN="$(command -v node)" "$RUNNER_TEMP/floatdesk-local-service-smoke"
      - name: Compile and validate local GUI configuration/locking policy
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library native/macos/FloatdeskInstanceLock.swift native/macos/FloatdeskSourceSeal.swift native/macos/FloatdeskLocalService.swift native/macos/FloatdeskHostSettings.swift native/macos/FloatdeskHostSetupSmoke.swift -o "$RUNNER_TEMP/floatdesk-host-setup-test"
          FLOATDESK_REPO_ROOT="$GITHUB_WORKSPACE" FLOATDESK_NODE_BIN="$(command -v node)" "$RUNNER_TEMP/floatdesk-host-setup-test"
      - name: Verify local trust snapshot refuses changed server and browser code
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library native/macos/FloatdeskInstanceLock.swift native/macos/FloatdeskSourceSeal.swift native/macos/FloatdeskLocalService.swift native/macos/FloatdeskHostSettings.swift native/macos/FloatdeskSealSmoke.swift -o "$RUNNER_TEMP/floatdesk-source-seal-test"
          FLOATDESK_REPO_ROOT="$GITHUB_WORKSPACE" FLOATDESK_NODE_BIN="$(command -v node)" "$RUNNER_TEMP/floatdesk-source-seal-test"
      - name: Verify lock exclusion across independent processes and owner crash
        run: |
          set -euo pipefail
          LOCK_DIR="$RUNNER_TEMP/floatdesk-ci-lock"
          "$RUNNER_TEMP/floatdesk-host-setup-test" --hold-lock "$LOCK_DIR" > "$RUNNER_TEMP/lock-ready.log" &
          HOLDER=$!
          trap 'kill "$HOLDER" 2>/dev/null || true' EXIT
          for i in {1..50}; do
            if grep -q 'M11 lock held' "$RUNNER_TEMP/lock-ready.log"; then break; fi
            sleep .1
          done
          grep -q 'M11 lock held' "$RUNNER_TEMP/lock-ready.log"
          "$RUNNER_TEMP/floatdesk-host-setup-test" --expect-busy "$LOCK_DIR"
          kill "$HOLDER" || true
          wait "$HOLDER" || true
          "$RUNNER_TEMP/floatdesk-host-setup-test" --expect-free "$LOCK_DIR"
      - name: Simulate Mac menu process death and verify child shuts down
        run: |
          set -euo pipefail
          FLOATDESK_REPO_ROOT="$GITHUB_WORKSPACE" FLOATDESK_NODE_BIN="$(command -v node)" "$RUNNER_TEMP/floatdesk-local-service-smoke" --simulate-owner-death
          python3 - <<'PY'
          import socket,time
          for _ in range(60):
              try:
                  with socket.create_connection(('127.0.0.1',8789),timeout=.15): pass
              except OSError:
                  print('M10 owner-death cleanup: local server is closed')
                  break
              time.sleep(.1)
          else:
              raise SystemExit('Managed child survived parent pipe closure')
          PY
      - name: Inspect app bundle and assert no automatic services or permissions
        run: |
          python3 - <<'PY'
          import os,plistlib,pathlib
          app=pathlib.Path(os.environ['RUNNER_TEMP'])/'FLOATDESK Mac Host.app'
          p=plistlib.loads((app/'Contents/Info.plist').read_bytes())
          assert p['CFBundleExecutable']=='FloatdeskMacHost'
          assert p['LSUIElement'] is True
          assert p['CFBundleIdentifier']=='com.floatdesk.research.mac-host'
          assert not (app/'Contents/Library/LaunchServices').exists()
          assert not (app/'Contents/PlugIns').exists()
          assert (app/'Contents/MacOS/FloatdeskMacHost').is_file()
          print('Research Mac shell bundle metadata check passed')
          PY
          codesign --verify --deep --strict "$RUNNER_TEMP/FLOATDESK Mac Host.app"
